name: Bug report
description: Report an incorrect audit result
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use synthetic or sanitized events. Never post API keys, prompts, generated private content, headers, or customer logs.
  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true
  - type: dropdown
    id: dialect
    attributes:
      label: Dialect
      options: [openai-responses, anthropic-messages]
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal sanitized fixture and report
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
