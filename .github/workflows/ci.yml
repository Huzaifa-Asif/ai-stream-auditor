name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependency-free core on Node 18
        if: matrix.node == 18
        run: npm ci --omit=dev --ignore-scripts
      - name: Install integration dependencies on supported SDK runtimes
        if: matrix.node != 18
        run: npm ci --ignore-scripts
      - name: Check Node 18 core and package surface
        if: matrix.node == 18
        run: npm run check:core
      - name: Check core and official SDK integration
        if: matrix.node != 18
        run: npm run check
